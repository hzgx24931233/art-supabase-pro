# 程管家 art-supabase-pro —— 容器编排（单服务；后续与其它服务同网编排时把 service 追加到同一 network）
#
#   docker compose up -d --build     构建并启动
#   docker compose ps                查看状态（含健康检查）
#   docker compose logs -f web       查看日志
#   docker compose restart web       重启
#   docker compose down              停止并删除容器与网络（镜像保留）
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建期变量：VITE_* 会被内联进静态产物，改完必须重新 build 才生效
        VITE_BASE_URL: /
        VITE_OUT_DIR: dist
        VITE_BUILD_COMPRESS: 'true'
        VITE_SUPABASE_URL: https://nvzlwcutsqptngyqfzqs.supabase.co
        VITE_SUPABASE_KEY: sb_publishable_QG4vqGLvkbaR7j5pD7woeA_kF_2ORTC
    image: art-supabase-pro:latest
    container_name: art-supabase-pro
    restart: unless-stopped
    ports:
      - '8080:80'
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    networks:
      - art-net
    # 只调 nginx 配置、不重建镜像时可挂载（会覆盖镜像内同名文件）：
    # volumes:
    #   - ./nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  art-net:
    driver: bridge
