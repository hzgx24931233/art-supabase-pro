#
# 亿企工场 art-supabase-pro —— 生产环境 Nginx 配置
#
# 该文件在镜像中替换 /etc/nginx/nginx.conf，仍复用官方镜像自带的 /etc/nginx/mime.types。
#
# 路由一览：
#   /assets/**            带内容 hash 的构建产物     → 长期强缓存；文件缺失直接 404
#   /vendor|wasm|data/**  未加 hash 的运行时资源     → 短缓存 + Last-Modified/ETag 协商
#   /index.html           应用入口                   → 不缓存，保证发版后立即生效
#   /api/**               Supabase 反向代理          → 见 location ^~ /api/
#   其余任意路径          SPA 回退                   → try_files ... /index.html
#

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # 附件上传/导入文件体积上限（当前前端直传 Supabase Storage，走 /api 时才生效）
    client_max_body_size 50m;

    # gzip：构建期已由 vite-plugin-compression 生成 .gz，gzip_static 优先直接命中，
    # 未覆盖到的类型再由 nginx 实时压缩。
    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json application/xml
                    application/wasm image/svg+xml;

    # WebSocket / SSE 升级头（Supabase Realtime 走 wss://<域名>/realtime/v1）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        listen  [::]:80;
        server_name  _;

        charset  utf-8;
        root     /usr/share/nginx/html;
        index    index.html;

        # 安全响应头（CSP 暂未启用：应用存在内联脚本、blob: Worker 与 Monaco/wasm，
        # 需要按实际资源来源单独设计后再开启，避免误伤）
        add_header X-Content-Type-Options  "nosniff"                        always;
        add_header X-Frame-Options         "SAMEORIGIN"                     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # ---------------- 带 hash 的构建产物：一年强缓存 ----------------
        # 注意：这里必须 404，不能回退到 index.html，否则缺失的 JS 会以 HTML 形式返回，
        # 浏览器报 "Unexpected token '<'" 之类的模块解析错误。
        location ~* ^/(?:.+/)?assets/ {
            expires    1y;
            access_log off;
            try_files  $uri =404;
        }

        # -------- 未加 hash 的运行时资源（文档预览引擎、行政区划数据）--------
        # 文件名稳定，用短缓存 + 协商缓存：既避免重复下载大体积 wasm，
        # 又保证发版后能通过 304/200 及时换新。
        location ~* ^/(?:.+/)?(?:vendor|wasm|data)/ {
            expires    1h;
            access_log off;
            try_files  $uri =404;
        }

        # 入口文件不缓存，发版后立即拿到新的资源清单
        location = /index.html {
            expires -1;
        }

        # ---------------- Supabase 反向代理 ----------------
        # /api/rest/v1/**       → https://<ref>.supabase.co/rest/v1/**
        # /api/auth/v1/**       → .../auth/v1/**
        # /api/storage/v1/**    → .../storage/v1/**
        # /api/functions/v1/**  → .../functions/v1/**
        # /api/realtime/v1/**   → .../realtime/v1/**（WebSocket 已透传 Upgrade）
        #
        # 上游写静态地址（启动时解析一次）：Docker Desktop、Linux、K8s、裸机都不需要额外配置 DNS。
        # 代价是启动阶段必须能解析该域名，否则 nginx 直接退出（实测：
        #   [emerg] host not found in upstream "xxx.supabase.co" → 容器 exit 1），
        # 因此「启动时」必须带 restart 策略（compose 已设 restart: unless-stopped，
        # docker run 请加 --restart unless-stopped），DNS 恢复后由重启自愈。
        # 若要改成「请求时解析」（启动不依赖 DNS），可用变量形式 + 按环境指定 resolver：
        #   set $supabase_origin "https://nvzlwcutsqptngyqfzqs.supabase.co";
        #   resolver 127.0.0.11 valid=30s ipv6=off;   # Docker 嵌入式 DNS（Linux）
        #   proxy_pass $supabase_origin;
        # 注意：Docker Desktop 容器的 /etc/resolv.conf 是 192.168.65.7 而不是 127.0.0.11，
        # 且 resolver 列表对单次查询不做故障转移，写错会 502（详见 DOCKER.md 6.5）。
        #
        # 注意：前端 Supabase 客户端默认用 VITE_SUPABASE_URL 绝对地址直连，
        # 只有把请求指到同源 /api 时才经过这里，详见 DOCKER.md「注意事项」。
        location = /api {
            return 308 /api/;
        }

        location ^~ /api/ {
            # ↓↓↓ 切换 Supabase 环境时，下面这行地址和 Host 头必须一起改；结尾的 / 用于去掉 /api 前缀 ↓↓↓
            proxy_pass https://nvzlwcutsqptngyqfzqs.supabase.co/;
            proxy_http_version 1.1;

            proxy_set_header Host              nvzlwcutsqptngyqfzqs.supabase.co;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            # 上游为 HTTPS：开启 SNI，并校验上游证书（用镜像内 CA 包）
            proxy_ssl_server_name        on;
            proxy_ssl_protocols          TLSv1.2 TLSv1.3;
            proxy_ssl_verify             on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth       2;

            proxy_connect_timeout 15s;
            proxy_send_timeout    60s;
            proxy_read_timeout    300s;   # Realtime 长连接

            proxy_buffering off;          # Edge Function / Realtime 的流式响应
            gzip off;                     # 上游自行压缩，避免二次压缩与流式被缓冲
        }

        # ---------------- SPA：History 路由回退 ----------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 子路径部署（VITE_BASE_URL=/art-supabase-pro/）时启用下列块，
        # 同时把 dist 放到 /usr/share/nginx/html/art-supabase-pro/，详见 DOCKER.md。
        # location /art-supabase-pro/ {
        #     try_files $uri $uri/ /art-supabase-pro/index.html;
        # }

        # 上游/网关异常时的兜底页面（官方镜像自带 /usr/share/nginx/html/50x.html）
        error_page  500 502 503 504  /50x.html;
        location = /50x.html {
            root  /usr/share/nginx/html;
        }
    }
}
